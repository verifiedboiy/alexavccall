<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Command Center</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
        <i data-lucide="command" style="color: var(--accent-blue);"></i>
        <h2 style="font-size: 1.2rem;">OWNER HUB</h2>
      </div>

      <div class="status-badge" style="width: 100%; justify-content: center; margin-bottom: 2rem;">
        <div class="status-dot online"></div>
        <span>System Live</span>
      </div>

      <h3 class="control-section-title">Live Users</h3>
      <div id="user-list" class="user-list">
        <!-- Users will appear here -->
        <p style="color: var(--text-muted); font-size: 0.8rem; text-align: center;">Waiting for connections...</p>
      </div>

      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color);">
        <p class="mono" style="font-size: 0.7rem; color: var(--text-muted);">OWNER ID: <span style="color: #fff;">+1 (202) 555-0100</span></p>
      </div>
    </aside>

    <main class="main-view">
      <div class="video-monitor">
        <div class="monitor-screen">
          <div class="monitor-label">Remote User Feed</div>
          <video id="remote-user-view" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>
        <div class="monitor-screen">
          <div class="monitor-label">Outgoing Stream (Pre-recorded)</div>
          <video id="outgoing-preview" autoplay playsinline muted loop style="width: 100%; height: 100%; object-fit: cover;" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
        </div>
      </div>

      <div class="admin-controls">
        <div class="control-section">
          <h3 class="control-section-title">Connection Tactics</h3>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button id="btn-fake-lag" class="btn-primary" style="background: #e3b341; color: #000;">
              <i data-lucide="wifi-off" style="display: inline; vertical-align: middle; margin-right: 0.5rem;"></i>
              TRIGGER FAKE LAG
            </button>
            <button id="btn-fix-connection" class="btn-primary" style="background: var(--accent-green);">
              <i data-lucide="zap" style="display: inline; vertical-align: middle; margin-right: 0.5rem;"></i>
              FIX CONNECTION
            </button>
            <button id="btn-end-call" class="btn-danger">
              <i data-lucide="phone-off" style="display: inline; vertical-align: middle; margin-right: 0.5rem;"></i>
              TERMINATE CALL
            </button>
          </div>
        </div>

        <div class="control-section">
          <h3 class="control-section-title">Virtual Camera Controls</h3>
          <div style="margin-bottom: 1rem;">
            <label style="font-size: 0.75rem; color: var(--text-muted);">SELECT SOURCE</label>
            <input type="file" id="video-source-input" accept="video/*" style="display: none;" />
            <button onclick="document.getElementById('video-source-input').click()" class="speed-btn" style="width: 100%; margin-top: 0.5rem;">UPLOAD NEW CLIP</button>
          </div>
          <div class="speed-controls">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn active" data-speed="1">1.0x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
            <button class="speed-btn" data-speed="2">2.0x</button>
          </div>
          <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 1rem;">CURRENT CLIP: <span id="current-clip-name">default_intro.mp4</span></p>
        </div>

        <div class="control-section">
          <h3 class="control-section-title">Audio Injector</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <button class="speed-btn">OFFICE HUM</button>
            <button class="speed-btn">CAFE NOISE</button>
            <button class="speed-btn">STREET AMBIENT</button>
            <button class="speed-btn">STATIC</button>
          </div>
          <div style="margin-top: 1rem;">
            <label style="font-size: 0.75rem; color: var(--text-muted);">INJECTION VOLUME</label>
            <input type="range" style="width: 100%;" />
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./src/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
